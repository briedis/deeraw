# Builds Deeraw for Windows (x64 .exe) and macOS (universal .app, zipped).
# Every push/PR uploads the builds as workflow artifacts; pushing a `v*` tag also publishes
# them as a GitHub release.
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/deeraw.exe dist/
          # Symbols, so crash report backtraces name functions (found next to the exe).
          Copy-Item target/release/deeraw.pdb dist/
          Copy-Item LICENSE.md dist/
          Compress-Archive -Path dist/* -DestinationPath deeraw-windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: deeraw-windows-x64
          path: deeraw-windows-x64.zip
      # Microsoft Store package. Unsigned: the Store signs it on submission, so it's a workflow artifact
      # to upload in Partner Center, not part of the GitHub release.
      - name: Package MSIX
        shell: pwsh
        run: ./msix/build.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: deeraw-windows-x64-msix
          path: deeraw-windows-x64.msix

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      # Signing with the same certificate every build lets macOS keep the Screen Recording permission
      # across updates (an ad-hoc signature is identified by its hash, which changes each build).
      # Without the secrets (e.g. pull requests from forks) the app is signed ad-hoc.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.P12 != ''
        run: |
          KC=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # By SHA-1, since codesign won't pick an untrusted self-signed identity by name.
          SIGN_ID=$(security find-identity "$KC" | awk '/Deeraw Signing/ {print $2; exit}')
          test -n "$SIGN_ID"
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"
      - name: Bundle Deeraw.app
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          APP=Deeraw.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/deeraw" \
            target/aarch64-apple-darwin/release/deeraw \
            target/x86_64-apple-darwin/release/deeraw

          # Icon: render assets/icon.png (256px) into an .icns.
          ICONSET=$(mktemp -d)/deeraw.iconset
          mkdir "$ICONSET"
          for size in 16 32 128 256; do
            sips -z $size $size assets/icon.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            if [ $double -le 256 ]; then
              sips -z $double $double assets/icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/deeraw.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Deeraw</string>
            <key>CFBundleDisplayName</key><string>Deeraw</string>
            <key>CFBundleIdentifier</key><string>com.briedis.deeraw</string>
            <key>CFBundleExecutable</key><string>deeraw</string>
            <key>CFBundleIconFile</key><string>deeraw</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Menu bar launcher, inside Deeraw.app (Contents/Library/LoginItems). It also signs Deeraw.app
          # with $SIGN_ID (ad-hoc if unset: Apple Silicon refuses to run unsigned binaries at all).
          sh macos-launcher/build.sh "$APP"
          codesign --verify --deep --strict "$APP"

          mkdir out
          mv "$APP" out/
          (cd out && ditto -c -k --sequesterRsrc . ../deeraw-macos-universal.zip)
      - uses: actions/upload-artifact@v6
        with:
          name: deeraw-macos-universal
          path: deeraw-macos-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
      # Points the cask in briedis/homebrew-tap at the new release. HOMEBREW_TAP_TOKEN is a fine-grained
      # token with Contents read/write on that repo (github.token can't push to other repos).
      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(sha256sum dist/deeraw-macos-universal.zip | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/briedis/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^(\s*version )\"[^\"]*\"/\1\"$VERSION\"/; s/^(\s*sha256 )\"[^\"]*\"/\1\"$SHA\"/" Casks/deeraw.rb
          git diff --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "deeraw $VERSION"
          git push
