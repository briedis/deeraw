[package]
name = "deeraw"
version = "0.1.0"
edition = "2024"
description = "An opinionated drawing app"
authors = ["Mārtiņš Briedis"]
license = "PolyForm-Shield-1.0.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
png = { version = "0.18", default-features = false }
rfd = { version = "0.17.2", default-features = false }

[build-dependencies]
winresource = "0.1"

# egui/wgpu are very slow unoptimized (laggy window dragging), so optimize dependencies even
# in dev builds; our own crate stays quick to compile.
[profile.dev.package."*"]
opt-level = 3
