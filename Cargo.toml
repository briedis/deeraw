[package]
name = "deeraw"
version = "0.6.2"
edition = "2024"
description = "An opinionated drawing app"
authors = ["Mārtiņš Briedis"]
license = "PolyForm-Shield-1.0.0"
repository = "https://github.com/briedis/deeraw"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# `persistence`: settings (and the window size) are remembered between launches.
eframe = { version = "0.37.0", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
png = { version = "0.18", default-features = false }
rfd = { version = "0.17.2", default-features = false }

# The web build (`trunk serve`): eframe's WebRunner needs a canvas element and an async start.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Document", "HtmlCanvasElement", "Window"] }

# The Screenshot button hides and shows the window itself, and the menu bar launcher asks for one by
# distributed notification (`app/screenshot.rs`); all already in winit's tree.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSDistributedNotificationCenter", "NSNotification", "NSOperation", "NSString"] }

# The Screenshot button on Windows: Snipping Tool's area selection, read back from the clipboard;
# both already in eframe's tree.
[target.'cfg(windows)'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

# egui/wgpu are very slow unoptimized (laggy window dragging), so optimize dependencies even
# in dev builds; our own crate stays quick to compile.
[profile.dev.package."*"]
opt-level = 3
